<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Cable Termination / केबल टर्मिनेशन</text>
  <rect x="100" y="80" width="1000" height="650" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <!-- RJ45 Pinout -->
  <text x="350" y="130" fill="#1e293b" font-size="16" text-anchor="middle" font-weight="bold">RJ45 Connector / RJ45 कनेक्टर</text>
  <rect x="200" y="150" width="300" height="180" rx="8" fill="#1e293b"/>
  <rect x="220" y="170" width="260" height="20" fill="#dc2626"/><text x="350" y="185" fill="white" font-size="10" text-anchor="middle">Pin 1: Orange-White</text>
  <rect x="220" y="195" width="260" height="20" fill="#ea580c"/><text x="350" y="210" fill="white" font-size="10" text-anchor="middle">Pin 2: Orange</text>
  <rect x="220" y="220" width="260" height="20" fill="#16a34a"/><text x="350" y="235" fill="white" font-size="10" text-anchor="middle">Pin 3: Green-White</text>
  <rect x="220" y="245" width="260" height="20" fill="#2563eb"/><text x="350" y="260" fill="white" font-size="10" text-anchor="middle">Pin 4: Blue</text>
  <rect x="220" y="270" width="260" height="20" fill="#7c3aed"/><text x="350" y="285" fill="white" font-size="10" text-anchor="middle">Pin 5: Blue-White</text>
  <rect x="220" y="295" width="260" height="20" fill="#16a34a"/><text x="350" y="310" fill="white" font-size="10" text-anchor="middle">Pin 6: Green</text>
  <text x="350" y="350" fill="#64748b" font-size="11" text-anchor="middle">T568B Standard (Industry Standard)</text>
  <!-- BNC -->
  <text x="850" y="130" fill="#1e293b" font-size="16" text-anchor="middle" font-weight="bold">BNC Connector (Analog) / BNC कनेक्टर</text>
  <rect x="700" y="150" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="850" cy="210" r="30" fill="none" stroke="#64748b" stroke-width="4"/>
  <circle cx="850" cy="210" r="5" fill="#64748b"/>
  <text x="850" y="300" fill="#64748b" font-size="11" text-anchor="middle">Center: Video Signal</text>
  <text x="850" y="320" fill="#64748b" font-size="11" text-anchor="middle">Outer: Ground/Shield</text>
  <!-- CRIMP Tools -->
  <text x="600" y="420" fill="#1e293b" font-size="16" text-anchor="middle" font-weight="bold">Required Tools / आवश्यक उपकरण</text>
  <rect x="150" y="440" width="250" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="275" y="478" fill="#1e293b" font-size="12" text-anchor="middle">Crimping Tool / क्रिम्पिंग टूल</text>
  <rect x="450" y="440" width="300" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="600" y="478" fill="#1e293b" font-size="12" text-anchor="middle">Cable Tester / केबल टेस्टर</text>
  <rect x="800" y="440" width="250" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="925" y="478" fill="#1e293b" font-size="12" text-anchor="middle">Wire Stripper</text>
  <text x="600" y="560" fill="#64748b" font-size="12" text-anchor="middle">Always test after crimping: Check continuity on all 8 pins</text>
</svg>