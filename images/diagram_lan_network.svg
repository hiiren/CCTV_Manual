<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="24" text-anchor="middle" font-weight="bold">LAN Network Layout for CCTV / CCTV LAN नेटवर्क लेआउट</text>
  <rect x="50" y="80" width="1100" height="650" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <!-- Router -->
  <rect x="500" y="120" width="200" height="70" rx="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="150" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Router / राउटर</text>
  <text x="600" y="170" fill="#bfdbfe" font-size="11" text-anchor="middle">192.168.1.1</text>
  <!-- Switch -->
  <rect x="450" y="260" width="300" height="60" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="600" y="295" fill="white" font-size="14" text-anchor="middle" font-weight="bold">PoE Switch / पीओई स्विच</text>
  <!-- Lines from Router to Switch -->
  <line x1="600" y1="190" x2="600" y2="260" stroke="#64748b" stroke-width="2"/>
  <!-- Cameras -->
  <circle cx="200" cy="450" r="45" fill="#16a34a" stroke="#15803d" stroke-width="2"/><text x="200" y="455" fill="white" font-size="12" text-anchor="middle">Cam 1</text>
  <circle cx="400" cy="450" r="45" fill="#16a34a" stroke="#15803d" stroke-width="2"/><text x="400" y="455" fill="white" font-size="12" text-anchor="middle">Cam 2</text>
  <circle cx="600" cy="450" r="45" fill="#16a34a" stroke="#15803d" stroke-width="2"/><text x="600" y="455" fill="white" font-size="12" text-anchor="middle">Cam 3</text>
  <circle cx="800" cy="450" r="45" fill="#16a34a" stroke="#15803d" stroke-width="2"/><text x="800" y="455" fill="white" font-size="12" text-anchor="middle">Cam 4</text>
  <circle cx="1000" cy="450" r="45" fill="#16a34a" stroke="#15803d" stroke-width="2"/><text x="1000" y="455" fill="white" font-size="12" text-anchor="middle">Cam 5</text>
  <!-- Lines from Switch to Cameras -->
  <line x1="350" y1="320" x2="200" y2="405" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="450" y1="320" x2="400" y2="405" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="550" y1="320" x2="600" y2="405" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="650" y1="320" x2="800" y2="405" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="750" y1="320" x2="1000" y2="405" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- NVR -->
  <rect x="450" y="580" width="300" height="70" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  <text x="600" y="610" fill="white" font-size="14" text-anchor="middle" font-weight="bold">NVR / एनवीआर</text>
  <text x="600" y="630" fill="#fecaca" font-size="11" text-anchor="middle">192.168.1.10</text>
  <line x1="600" y1="320" x2="600" y2="580" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Labels -->
  <text x="600" y="760" fill="#64748b" font-size="12" text-anchor="middle">CAT6 Cable (PoE) = Data + Power | Internet = WAN Link</text>
</svg>