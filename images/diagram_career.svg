  <rect x="330" y="610" width="290" height="50" rx="8" fill="#059669"/><text x="475" y="642" fill="white" font-size="12" text-anchor="middle" font-weight="bold">Junior Technician ₹12K-20K</text>
  <text x="670" y="642" fill="#64748b" font-size="11">6-12 months</text>
  <rect x="310" y="540" width="330" height="50" rx="8" fill="#2563eb"/><text x="475" y="572" fill="white" font-size="12" text-anchor="middle" font-weight="bold">Technician ₹18K-30K</text>
