<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Subnetting for Multi-floor CCTV / मल्टी-फ्लोर CCTV सबनेटिंग</text>
  <!-- Building -->
  <rect x="400" y="80" width="400" height="600" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <!-- Floor 3 -->
  <rect x="420" y="100" width="360" height="120" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="130" fill="#dc2626" font-size="14" text-anchor="middle" font-weight="bold">3rd Floor - 6 Cameras</text>
  <text x="600" y="155" fill="#64748b" font-size="12" text-anchor="middle">192.168.4.0/24</text>
  <text x="600" y="175" fill="#64748b" font-size="11" text-anchor="middle">Range: .1 - .6</text>
  <!-- Floor 2 -->
  <rect x="420" y="230" width="360" height="120" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="600" y="260" fill="#ea580c" font-size="14" text-anchor="middle" font-weight="bold">2nd Floor - 10 Cameras</text>
  <text x="600" y="285" fill="#64748b" font-size="12" text-anchor="middle">192.168.3.0/24</text>
  <text x="600" y="305" fill="#64748b" font-size="11" text-anchor="middle">Range: .1 - .10</text>
  <!-- Floor 1 -->
  <rect x="420" y="360" width="360" height="120" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="600" y="390" fill="#16a34a" font-size="14" text-anchor="middle" font-weight="bold">1st Floor - 12 Cameras</text>
  <text x="600" y="415" fill="#64748b" font-size="12" text-anchor="middle">192.168.2.0/24</text>
  <text x="600" y="435" fill="#64748b" font-size="11" text-anchor="middle">Range: .1 - .12</text>
  <!-- Ground Floor -->
  <rect x="420" y="490" width="360" height="120" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="600" y="520" fill="#2563eb" font-size="14" text-anchor="middle" font-weight="bold">Ground Floor - 8 Cameras</text>
  <text x="600" y="545" fill="#64748b" font-size="12" text-anchor="middle">192.168.1.0/24</text>
  <text x="600" y="565" fill="#64748b" font-size="11" text-anchor="middle">Range: .1 - .8</text>
  <!-- Core Switch -->
  <rect x="100" y="300" width="200" height="80" rx="8" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="200" y="335" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Core Switch / Router</text>
  <text x="200" y="355" fill="#ddd6fe" font-size="11" text-anchor="middle">VLAN Manager</text>
  <line x1="300" y1="340" x2="420" y2="160" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="300" y1="340" x2="420" y2="290" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="300" y1="340" x2="420" y2="420" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="300" y1="340" x2="420" y2="550" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="600" y="730" fill="#64748b" font-size="12" text-anchor="middle">Separate subnets improve security and performance by isolating traffic</text>
</svg>