<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Access Control Working Flow / एक्सेस कंट्रोल फ्लो</text>
  <!-- Flow Steps -->
  <rect x="450" y="80" width="300" height="50" rx="25" fill="#2563eb"/><text x="600" y="112" fill="white" font-size="13" text-anchor="middle">1. User Approaches Door</text>
  <line x1="600" y1="130" x2="600" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="150" width="300" height="50" rx="25" fill="#059669"/><text x="600" y="182" fill="white" font-size="13" text-anchor="middle">2. Presents Card/Finger/Face</text>
  <line x1="600" y1="200" x2="600" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="220" width="300" height="50" rx="25" fill="#7c3aed"/><text x="600" y="252" fill="white" font-size="13" text-anchor="middle">3. Reader Captures Data</text>
  <line x1="600" y1="270" x2="600" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="290" width="300" height="50" rx="25" fill="#ea580c"/><text x="600" y="322" fill="white" font-size="13" text-anchor="middle">4. Controller Checks Database</text>
  <line x1="600" y1="340" x2="600" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Decision -->
  <polygon points="600,360 750,410 600,460 450,410" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="415" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">Authorized?</text>
  <!-- Yes path -->
  <line x1="600" y1="460" x2="600" y2="500" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="615" y="485" fill="#16a34a" font-size="12">Yes</text>
  <rect x="450" y="500" width="300" height="50" rx="25" fill="#16a34a"/><text x="600" y="532" fill="white" font-size="13" text-anchor="middle">5. Unlock Door → User Enters</text>
  <line x1="600" y1="550" x2="600" y2="570" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="570" width="300" height="50" rx="25" fill="#059669"/><text x="600" y="602" fill="white" font-size="13" text-anchor="middle">6. Log Entry Created</text>
  <line x1="600" y1="620" x2="600" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="640" width="300" height="50" rx="25" fill="#2563eb"/><text x="600" y="672" fill="white" font-size="13" text-anchor="middle">7. Door Auto-Lock</text>
  <!-- No path -->
  <line x1="750" y1="410" x2="900" y2="410" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="820" y="400" fill="#dc2626" font-size="12">No</text>
  <rect x="900" y="385" width="200" height="50" rx="25" fill="#dc2626"/><text x="1000" y="417" fill="white" font-size="12" text-anchor="middle">Deny + Alarm</text>
  <defs><marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker></defs>
</svg>