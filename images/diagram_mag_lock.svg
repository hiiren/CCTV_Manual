<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Magnetic Lock Installation / मैग्नेटिक लॉक इंस्टॉलेशन</text>
  <!-- Door Frame -->
  <rect x="350" y="80" width="500" height="600" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <!-- Door -->
  <rect x="380" y="120" width="440" height="530" rx="4" fill="#d4a574" stroke="#8b6914" stroke-width="2"/>
  <text x="600" y="400" fill="#8b6914" font-size="16" text-anchor="middle">DOOR / दरवाजा</text>
  <!-- Mag Lock on Frame -->
  <rect x="370" y="130" width="180" height="40" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <text x="460" y="155" fill="white" font-size="11" text-anchor="middle">Magnetic Lock / मैग्नेट</text>
  <!-- Armature Plate on Door -->
  <rect x="370" y="170" width="180" height="30" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="190" fill="#1e293b" font-size="10" text-anchor="middle">Armature Plate</text>
  <!-- Gap -->
  <text x="570" y="165" fill="#dc2626" font-size="10">&lt;0.5mm gap</text>
  <!-- Wires -->
  <line x1="370" y1="150" x2="250" y2="150" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="150" x2="250" y2="300" stroke="#dc2626" stroke-width="3"/>
  <rect x="200" y="300" width="100" height="60" rx="6" fill="#2563eb"/><text x="250" y="335" fill="white" font-size="10" text-anchor="middle">Controller</text>
  <!-- Reed Switch -->
  <rect x="820" y="130" width="120" height="30" rx="4" fill="#16a34a"/><text x="880" y="150" fill="white" font-size="10" text-anchor="middle">Reed Switch</text>
  <text x="880" y="180" fill="#64748b" font-size="10" text-anchor="middle">Door Position Sensor</text>
  <!-- Labels -->
  <text x="600" y="720" fill="#64748b" font-size="12" text-anchor="middle">12V DC Power | Holding Force: 280kg | Gap: &lt;0.5mm when closed</text>
</svg>