<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">4 Camera Setup / 4 कैमरा सेटअप</text>
  <!-- Router -->
  <rect x="450" y="80" width="300" height="60" rx="8" fill="#2563eb"/><text x="600" y="118" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Router</text>
  <!-- Switch -->
  <rect x="350" y="200" width="500" height="70" rx="8" fill="#059669"/><text x="600" y="245" fill="white" font-size="14" text-anchor="middle" font-weight="bold">PoE Switch (8-Port)</text>
  <line x1="600" y1="140" x2="600" y2="200" stroke="#64748b" stroke-width="2"/>
  <!-- Cameras in quadrants -->
  <rect x="100" y="350" width="200" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="390" fill="#16a34a" font-size="14" text-anchor="middle" font-weight="bold">Cam 1 - Front Gate</text>
  <text x="200" y="415" fill="#64748b" font-size="11" text-anchor="middle">.101</text>
  <rect x="450" y="350" width="200" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="390" fill="#16a34a" font-size="14" text-anchor="middle" font-weight="bold">Cam 2 - Back Door</text>
  <text x="550" y="415" fill="#64748b" font-size="11" text-anchor="middle">.102</text>
  <rect x="750" y="350" width="200" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="850" y="390" fill="#16a34a" font-size="14" text-anchor="middle" font-weight="bold">Cam 3 - Parking</text>
  <text x="850" y="415" fill="#64748b" font-size="11" text-anchor="middle">.103</text>
  <rect x="1000" y="350" width="200" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1100" y="390" fill="#16a34a" font-size="14" text-anchor="middle" font-weight="bold">Cam 4 - Corridor</text>
  <text x="1100" y="415" fill="#64748b" font-size="11" text-anchor="middle">.104</text>
  <line x1="550" y1="270" x2="200" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="600" y1="270" x2="550" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="650" y1="270" x2="850" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="700" y1="270" x2="1100" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- NVR -->
  <rect x="350" y="550" width="500" height="70" rx="8" fill="#dc2626"/><text x="600" y="595" fill="white" font-size="14" text-anchor="middle" font-weight="bold">NVR (4-8 Channel)</text>
  <line x1="600" y1="470" x2="600" y2="550" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="600" y="690" fill="#64748b" font-size="12" text-anchor="middle">Bandwidth: 4 × 5Mbps = 20Mbps | Storage: ~30GB/day @ 4MP</text>
</svg>