<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Internet Data Path / इंटरनेट डेटा पाथ</text>
  <text x="600" y="75" fill="#64748b" font-size="14" text-anchor="middle">Camera to Mobile Phone - Video Data Journey</text>
  <!-- Data Flow -->
  <rect x="30" y="120" width="120" height="60" rx="8" fill="#16a34a"/><text x="90" y="155" fill="white" font-size="11" text-anchor="middle">Camera</text>
  <text x="90" y="195" fill="#64748b" font-size="10" text-anchor="middle">192.168.1.100</text>
  <line x1="150" y1="150" x2="200" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="120" width="120" height="60" rx="8" fill="#059669"/><text x="260" y="155" fill="white" font-size="11" text-anchor="middle">PoE Switch</text>
  <line x1="320" y1="150" x2="370" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="370" y="120" width="120" height="60" rx="8" fill="#2563eb"/><text x="430" y="155" fill="white" font-size="11" text-anchor="middle">Router</text>
  <line x1="490" y1="150" x2="540" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="120" width="120" height="60" rx="8" fill="#7c3aed"/><text x="600" y="155" fill="white" font-size="11" text-anchor="middle">ISP Modem</text>
  <line x1="660" y1="150" x2="710" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="710" y="120" width="120" height="60" rx="8" fill="#ea580c"/><text x="770" y="155" fill="white" font-size="11" text-anchor="middle">ISP Network</text>
  <line x1="830" y1="150" x2="880" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Cloud -->
  <ellipse cx="990" cy="150" rx="90" ry="45" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="990" y="155" fill="#475569" font-size="14" text-anchor="middle">Internet</text>
  <line x1="1080" y1="150" x2="1130" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Return path -->
  <rect x="30" y="300" width="120" height="60" rx="8" fill="#2563eb"/><text x="90" y="335" fill="white" font-size="11" text-anchor="middle">Mobile Phone</text>
  <text x="90" y="375" fill="#64748b" font-size="10" text-anchor="middle">Remote Viewer</text>
  <text x="600" y="450" fill="#1e293b" font-size="16" text-anchor="middle" font-weight="bold">Upload Path (Camera → Cloud)</text>
  <text x="600" y="475" fill="#1e293b" font-size="16" text-anchor="middle" font-weight="bold">Download Path (Cloud → Mobile)</text>
  <text x="600" y="520" fill="#64748b" font-size="12" text-anchor="middle">Latency: Camera→ISP: 5ms | ISP→Cloud: 20ms | Cloud→Mobile: 30ms</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker></defs>
</svg>