<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Two Switch Network / दो स्विच नेटवर्क</text>
  <!-- Switch 1 -->
  <rect x="150" y="200" width="300" height="80" rx="8" fill="#059669"/><text x="300" y="248" fill="white" font-size="14" text-anchor="middle" font-weight="bold">PoE Switch 1</text>
  <text x="300" y="300" fill="#64748b" font-size="12" text-anchor="middle">Floor 1 - 192.168.1.2</text>
  <!-- Switch 2 -->
  <rect x="750" y="200" width="300" height="80" rx="8" fill="#059669"/><text x="900" y="248" fill="white" font-size="14" text-anchor="middle" font-weight="bold">PoE Switch 2</text>
  <text x="900" y="300" fill="#64748b" font-size="12" text-anchor="middle">Floor 2 - 192.168.1.3</text>
  <!-- Router -->
  <rect x="450" y="80" width="300" height="70" rx="8" fill="#2563eb"/><text x="600" y="115" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Router 192.168.1.1</text>
  <line x1="600" y1="150" x2="300" y2="200" stroke="#64748b" stroke-width="2"/>
  <line x1="600" y1="150" x2="900" y2="200" stroke="#64748b" stroke-width="2"/>
  <!-- Cameras S1 -->
  <rect x="50" y="400" width="120" height="50" rx="6" fill="#16a34a"/><text x="110" y="432" fill="white" font-size="11" text-anchor="middle">Cam 1</text>
  <rect x="200" y="400" width="120" height="50" rx="6" fill="#16a34a"/><text x="260" y="432" fill="white" font-size="11" text-anchor="middle">Cam 2</text>
  <rect x="350" y="400" width="120" height="50" rx="6" fill="#16a34a"/><text x="410" y="432" fill="white" font-size="11" text-anchor="middle">Cam 3</text>
  <line x1="300" y1="280" x2="110" y2="400" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="300" y1="280" x2="260" y2="400" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="300" y1="280" x2="410" y2="400" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Cameras S2 -->
  <rect x="650" y="400" width="120" height="50" rx="6" fill="#16a34a"/><text x="710" y="432" fill="white" font-size="11" text-anchor="middle">Cam 4</text>
  <rect x="800" y="400" width="120" height="50" rx="6" fill="#16a34a"/><text x="860" y="432" fill="white" font-size="11" text-anchor="middle">Cam 5</text>
  <rect x="950" y="400" width="120" height="50" rx="6" fill="#16a34a"/><text x="1010" y="432" fill="white" font-size="11" text-anchor="middle">Cam 6</text>
  <line x1="900" y1="280" x2="710" y2="400" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="900" y1="280" x2="860" y2="400" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="900" y1="280" x2="1010" y2="400" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- NVR -->
  <rect x="450" y="520" width="300" height="70" rx="8" fill="#dc2626"/><text x="600" y="555" fill="white" font-size="14" text-anchor="middle" font-weight="bold">NVR 192.168.1.10</text>
  <text x="600" y="575" fill="#fecaca" font-size="11" text-anchor="middle">Connects to both switches</text>
  <line x1="450" y1="240" x2="600" y2="240" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="600" y="720" fill="#64748b" font-size="12" text-anchor="middle">Uplink between switches for redundancy (optional)</text>
</svg>