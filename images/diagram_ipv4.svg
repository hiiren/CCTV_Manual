<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="24" text-anchor="middle" font-weight="bold">IPv4 Address Structure / IPv4 एड्रेस स्ट्रक्चर</text>
  <!-- Main Address -->
  <text x="600" y="120" fill="#1e293b" font-size="36" text-anchor="middle" font-family="monospace" font-weight="bold">192.168.1.100</text>
  <!-- Octets -->
  <rect x="200" y="150" width="150" height="60" rx="6" fill="#2563eb"/><text x="275" y="185" fill="white" font-size="20" text-anchor="middle" font-family="monospace">192</text>
  <rect x="370" y="150" width="150" height="60" rx="6" fill="#2563eb"/><text x="445" y="185" fill="white" font-size="20" text-anchor="middle" font-family="monospace">168</text>
  <rect x="540" y="150" width="150" height="60" rx="6" fill="#16a34a"/><text x="615" y="185" fill="white" font-size="20" text-anchor="middle" font-family="monospace">1</text>
  <rect x="710" y="150" width="150" height="60" rx="6" fill="#dc2626"/><text x="785" y="185" fill="white" font-size="20" text-anchor="middle" font-family="monospace">100</text>
  <!-- Labels -->
  <text x="445" y="240" fill="#2563eb" font-size="14" text-anchor="middle" font-weight="bold">Network ID / नेटवर्क ID</text>
  <text x="615" y="240" fill="#16a34a" font-size="14" text-anchor="middle" font-weight="bold">Subnet / सबनेट</text>
  <text x="785" y="240" fill="#dc2626" font-size="14" text-anchor="middle" font-weight="bold">Host ID / होस्ट ID</text>
  <!-- Binary -->
  <text x="600" y="300" fill="#64748b" font-size="14" text-anchor="middle">Binary: 11000000.10101000.00000001.01100100</text>
  <!-- Subnet Mask -->
  <text x="600" y="360" fill="#1e293b" font-size="18" text-anchor="middle" font-weight="bold">Subnet Mask: 255.255.255.0 (/24)</text>
  <!-- House Analogy -->
  <rect x="150" y="420" width="900" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="600" y="460" fill="#16a34a" font-size="16" text-anchor="middle" font-weight="bold">🏠 House Analogy / घर की उपमा</text>
  <text x="300" y="510" fill="#1e293b" font-size="14" text-anchor="middle">Network ID = Street Name</text>
  <text x="300" y="535" fill="#1e293b" font-size="14" text-anchor="middle">192.168.1 = Main Street</text>
  <text x="750" y="510" fill="#1e293b" font-size="14" text-anchor="middle">Host ID = House Number</text>
  <text x="750" y="535" fill="#1e293b" font-size="14" text-anchor="middle">.100 = House #100</text>
</svg>