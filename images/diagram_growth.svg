<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Company Growth Stages / कंपनी ग्रोथ स्टेज</text>
  <!-- Stairs -->
  <rect x="80" y="600" width="180" height="100" rx="8" fill="#94a3b8"/><text x="170" y="640" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Stage 1</text><text x="170" y="660" fill="white" font-size="11" text-anchor="middle">Solo Tech</text><text x="170" y="680" fill="#e2e8f0" font-size="10" text-anchor="middle">₹20K-40K</text>
  <rect x="280" y="480" width="180" height="100" rx="8" fill="#059669"/><text x="370" y="520" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Stage 2</text><text x="370" y="540" fill="white" font-size="11" text-anchor="middle">Solo + Helper</text><text x="370" y="560" fill="#d1fae5" font-size="10" text-anchor="middle">₹40K-80K</text>
  <rect x="480" y="360" width="180" height="100" rx="8" fill="#2563eb"/><text x="570" y="400" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Stage 3</text><text x="570" y="420" fill="white" font-size="11" text-anchor="middle">Small Team</text><text x="570" y="440" fill="#bfdbfe" font-size="10" text-anchor="middle">₹80K-1.5L</text>
  <rect x="680" y="240" width="180" height="100" rx="8" fill="#7c3aed"/><text x="770" y="280" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Stage 4</text><text x="770" y="300" fill="white" font-size="11" text-anchor="middle">Company</text><text x="770" y="320" fill="#ddd6fe" font-size="10" text-anchor="middle">₹1.5L-5L</text>
  <rect x="880" y="120" width="180" height="100" rx="8" fill="#dc2626"/><text x="970" y="160" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Stage 5</text><text x="970" y="180" fill="white" font-size="11" text-anchor="middle">Enterprise</text><text x="970" y="200" fill="#fecaca" font-size="10" text-anchor="middle">₹5L+</text>
  <!-- Arrow -->
  <line x1="170" y1="600" x2="970" y2="120" stroke="#1e293b" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#a4)"/>
  <defs><marker id="a4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1e293b"/></marker></defs>
</svg>