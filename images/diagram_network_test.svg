<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Network Test Topology / नेटवर्क टेस्ट टोपोलॉजी</text>
  <!-- Internet -->
  <ellipse cx="600" cy="120" rx="120" ry="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="125" fill="#475569" font-size="14" text-anchor="middle">Internet</text>
  <!-- Router -->
  <rect x="500" y="200" width="200" height="60" rx="8" fill="#2563eb"/><text x="600" y="238" fill="white" font-size="13" text-anchor="middle">Router 192.168.1.1</text>
  <line x1="600" y1="160" x2="600" y2="200" stroke="#64748b" stroke-width="2"/>
  <!-- PoE Switch -->
  <rect x="425" y="320" width="350" height="60" rx="8" fill="#059669"/><text x="600" y="358" fill="white" font-size="13" text-anchor="middle">PoE Switch 192.168.1.2</text>
  <line x1="600" y1="260" x2="600" y2="320" stroke="#64748b" stroke-width="2"/>
  <!-- Cameras -->
  <rect x="100" y="450" width="180" height="80" rx="8" fill="#16a34a"/><text x="190" y="485" fill="white" font-size="12" text-anchor="middle">IP Cam 1</text><text x="190" y="505" fill="#d1fae5" font-size="11" text-anchor="middle">192.168.1.101</text>
  <rect x="350" y="450" width="180" height="80" rx="8" fill="#16a34a"/><text x="440" y="485" fill="white" font-size="12" text-anchor="middle">IP Cam 2</text><text x="440" y="505" fill="#d1fae5" font-size="11" text-anchor="middle">192.168.1.102</text>
  <rect x="600" y="450" width="180" height="80" rx="8" fill="#16a34a"/><text x="690" y="485" fill="white" font-size="12" text-anchor="middle">IP Cam 3</text><text x="690" y="505" fill="#d1fae5" font-size="11" text-anchor="middle">192.168.1.103</text>
  <rect x="850" y="450" width="250" height="80" rx="8" fill="#dc2626"/><text x="975" y="485" fill="white" font-size="12" text-anchor="middle">NVR 192.168.1.10</text>
  <!-- Lines -->
  <line x1="450" y1="380" x2="190" y2="450" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="525" y1="380" x2="440" y2="450" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="600" y1="380" x2="690" y2="450" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="700" y1="380" x2="975" y2="450" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="600" y="600" fill="#64748b" font-size="12" text-anchor="middle">Cable: CAT6 | Protocol: ONVIF/RTSP | Max Distance: 100m per segment</text>
</svg>