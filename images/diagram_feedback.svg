<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Feedback to Improvement Cycle / फीडबैक सुधार चक्र</text>
  <!-- Circle steps -->
  <circle cx="600" cy="400" r="250" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="475" y="100" width="250" height="60" rx="30" fill="#2563eb"/><text x="600" y="138" fill="white" font-size="13" text-anchor="middle" font-weight="bold">1. Collect Feedback</text>
  <line x1="720" y1="160" x2="820" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="800" y="250" width="250" height="60" rx="30" fill="#059669"/><text x="925" y="288" fill="white" font-size="13" text-anchor="middle" font-weight="bold">2. Analyze Results</text>
  <line x1="1000" y1="350" x2="950" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="800" y="490" width="250" height="60" rx="30" fill="#7c3aed"/><text x="925" y="528" fill="white" font-size="13" text-anchor="middle" font-weight="bold">3. Identify Gaps</text>
  <line x1="800" y1="550" x2="700" y2="620" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="475" y="640" width="250" height="60" rx="30" fill="#ea580c"/><text x="600" y="678" fill="white" font-size="13" text-anchor="middle" font-weight="bold">4. Update Content</text>
  <line x1="475" y1="670" x2="300" y2="620" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="150" y="490" width="250" height="60" rx="30" fill="#dc2626"/><text x="275" y="528" fill="white" font-size="13" text-anchor="middle" font-weight="bold">5. Implement Changes</text>
  <line x1="200" y1="450" x2="150" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="150" y="250" width="250" height="60" rx="30" fill="#0891b2"/><text x="275" y="288" fill="white" font-size="13" text-anchor="middle" font-weight="bold">6. Re-measure</text>
  <line x1="400" y1="260" x2="475" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>
  <text x="600" y="400" fill="#1e293b" font-size="16" text-anchor="middle" font-weight="bold">CONTINUOUS</text>
  <text x="600" y="425" fill="#1e293b" font-size="16" text-anchor="middle" font-weight="bold">IMPROVEMENT</text>
  <defs><marker id="a5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker></defs>
</svg>