<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="600" y="50" fill="#1e293b" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">IP VDP Network / IP VDP नेटवर्क</text>
  <!-- Router -->
  <rect x="475" y="100" width="250" height="60" rx="8" fill="#2563eb"/><text x="600" y="138" fill="white" font-size="14" text-anchor="middle">Router 192.168.1.1</text>
  <!-- PoE Switch -->
  <rect x="425" y="220" width="350" height="60" rx="8" fill="#059669"/><text x="600" y="258" fill="white" font-size="14" text-anchor="middle">PoE Switch 192.168.1.2</text>
  <line x1="600" y1="160" x2="600" y2="220" stroke="#64748b" stroke-width="2"/>
  <!-- Outdoor VDP -->
  <rect x="150" y="350" width="250" height="120" rx="8" fill="#363654" stroke="#4a4a6a" stroke-width="2"/>
  <text x="275" y="395" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Outdoor VDP</text>
  <text x="275" y="420" fill="#818cf8" font-size="12" text-anchor="middle">192.168.1.20</text>
  <line x1="450" y1="280" x2="275" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Indoor Monitor -->
  <rect x="800" y="350" width="250" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="925" y="395" fill="#1e293b" font-size="14" text-anchor="middle" font-weight="bold">Indoor Monitor</text>
  <text x="925" y="420" fill="#2563eb" font-size="12" text-anchor="middle">192.168.1.21</text>
  <line x1="750" y1="280" x2="925" y2="350" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Mobile Phone -->
  <rect x="450" y="520" width="300" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="565" fill="#16a34a" font-size="14" text-anchor="middle" font-weight="bold">📱 Mobile App (Remote)</text>
  <text x="600" y="590" fill="#64748b" font-size="11" text-anchor="middle">Cloud Access - कहीं से भी देखें</text>
  <line x1="600" y1="470" x2="600" y2="520" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="600" y="500" fill="#64748b" font-size="10" text-anchor="middle">via Cloud</text>
</svg>